<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="display.css">
<body>
    <h2>Display: inline</h2>
    <div class="inline">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    </div>
    <h2>Display: block</h2>
    <div class="Display: block">
    <div class="block">
        <span>1</span>
        <span>2</span>
        <span>3</span>
        <span>4</span>
    </div>
    <h2>Display: inline-block</h2>
    <div class="inline-block">
        <span>1</span>
        <span>2</span>
        <span>3</span>
        <span>4</span>
    </div>
    <h2>Display: none</h2>
    <div class="none">
        <span>1</span>
        <span class="none">2</span>
        <span>3</span>
        <span>4</span>
    </div>
    <h2>Display: hidden</h2>
    <div>
        <span>1</span>
        <span>2</span>
        <span class="hidden">3</span>
        <span>4</span>
    </div>
    <h2>Opacity</h2>
    <div class="opacity">
        <span>1</span>
        <span>2</span>
        <span class="opacity">3</span>
        <span>4</span>
    </div>
    <h2>Display: flex</h2>
    <div class="flex">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
    </div>
    <h2>Display: flex-start</h2>
    <div class="flex-start">
        <div>1</div>
        <div>2<br/2div>
        <div>3</div>
        <div>4</div>
</body>
</html>
